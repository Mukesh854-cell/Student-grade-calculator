<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>student-grade-calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body> 
    <div class="container">
        <h2>Student Grade Calculator</h2>
        <p>Enter marks below</p>

        <input type="text" class="student-name" placeholder="Enter student name">

        <input type="number" class="sub1" placeholder="Subject 1 marks">
        <input type="number" class="sub2" placeholder="Subject 2 marks">
        <input type="number" class="sub3" placeholder="Subject 3 marks">

        <button class="calculate-result">Calculate Result</button>

        <div class="result"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
